<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E5BFF"/>
      <stop offset="55%" stop-color="#1E3FC8"/>
      <stop offset="100%" stop-color="#0B2F8F"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE6FF"/>
    </linearGradient>
  </defs>

  <!-- 圆角方块底 -->
  <rect x="120" y="120" width="784" height="784" rx="176" fill="url(#bg)"/>

  <!-- 高光 -->
  <ellipse cx="512" cy="300" rx="300" ry="140" fill="#FFFFFF" opacity="0.06"/>

  <!-- 无线广播弧（efferent：由中心向外扩散） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" opacity="0.95">
    <path d="M512 480 m-125 0 a125 125 0 1 1 250 0" opacity="0.45"/>
    <path d="M512 480 m-205 0 a205 205 0 1 1 410 0" opacity="0.7"/>
    <path d="M512 480 m-285 0 a285 285 0 1 1 570 0" opacity="1"/>
  </g>

  <!-- 中心发射点 -->
  <circle cx="512" cy="480" r="38" fill="url(#dot)"/>

  <!-- 芯片（信号源，底部居中，整体上移贴近中心） -->
  <g>
    <!-- 芯片主体 -->
    <rect x="407" y="640" width="210" height="140" rx="24" fill="#FFFFFF" opacity="0.96"/>
    <!-- 晶圆内芯（die）细节 -->
    <rect x="435" y="666" width="154" height="72" rx="12" fill="#1E3FC8" opacity="0.28"/>
    <rect x="452" y="686" width="52" height="32" rx="5" fill="#1E3FC8" opacity="0.45"/>
    <rect x="520" y="686" width="52" height="32" rx="5" fill="#1E3FC8" opacity="0.45"/>
    <!-- pin 1 定位点 -->
    <circle cx="512" cy="654" r="8" fill="#1E3FC8"/>
    <!-- 左侧引脚 -->
    <rect x="377" y="662" width="30" height="18" rx="5" fill="#FFFFFF"/>
    <rect x="377" y="704" width="30" height="18" rx="5" fill="#FFFFFF"/>
    <rect x="377" y="746" width="30" height="18" rx="5" fill="#FFFFFF"/>
    <!-- 右侧引脚 -->
    <rect x="617" y="662" width="30" height="18" rx="5" fill="#FFFFFF"/>
    <rect x="617" y="704" width="30" height="18" rx="5" fill="#FFFFFF"/>
    <rect x="617" y="746" width="30" height="18" rx="5" fill="#FFFFFF"/>
    <!-- 底部引脚 -->
    <rect x="440" y="780" width="18" height="22" rx="5" fill="#FFFFFF"/>
    <rect x="474" y="780" width="18" height="22" rx="5" fill="#FFFFFF"/>
    <rect x="508" y="780" width="18" height="22" rx="5" fill="#FFFFFF"/>
    <rect x="542" y="780" width="18" height="22" rx="5" fill="#FFFFFF"/>
  </g>
</svg>
